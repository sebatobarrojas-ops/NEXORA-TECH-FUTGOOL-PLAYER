{% extends 'base.html' %}{% block title %}Crear partido{% endblock %}{% block content %}<div class="auth card"><span class="eyebrow">ORGANIZA EL JUEGO</span><h1>Nuevo partido</h1><form method="post" class="form"><label>Nombre del partido<input name="title" required minlength="3" maxlength="80" placeholder="Ej: Pichanga del viernes"></label><label>Ubicación<input name="location" required minlength="3" maxlength="120" placeholder="Ej: Cancha La Florida"></label><label>Fecha y hora<input type="datetime-local" name="scheduled_at" required></label><label>Cupos disponibles<input type="number" name="capacity" min="2" max="40" value="14" required></label><button class="btn">Publicar partido</button></form></div>{% endblock %}
